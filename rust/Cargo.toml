[package]
name = "demo-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "cdylib"]

[workspace]
# members = ["crates/demo-common", "crates/demo-http", "crates/demo-macros"]
members = ["crates/*"]

[workspace.dependencies]
boltffi = "0.26.1"
reqwest = "0.13.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros"] }
uniffi = { version = "0.31.2", features = ["tokio"] }

[dependencies]
demo-common = { path = "crates/demo-common" }
demo-http = { path = "crates/demo-http" }
demo-macros = { path = "crates/demo-macros" }

boltffi = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uniffi = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
